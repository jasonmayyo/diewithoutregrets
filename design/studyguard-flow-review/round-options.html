&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

olor:var(--sg-ink);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;box-shadow:0 14px 40px light-dark(#21342c12,#0003);overflow:hidden;display:flex;flex-direction:column}
#sg-round-directions .phone *{box-sizing:border-box}
#sg-round-directions .phone button{font:inherit;border:0;color:inherit;appearance:none;-webkit-tap-highlight-color:transparent}
#sg-round-directions .phone button:disabled{opacity:.65}
#sg-round-directions .phone button:focus-visible{outline:3px solid var(--sg-accent);outline-offset:3px}
#sg-round-directions .phone p{margin:0}
#sg-round-directions .phone h3{font:500 25px/1.23 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.65px;color:var(--sg-ink);margin:0}
#sg-round-directions .phone .tiny{font-size:12px;line-height:1.45;color:var(--sg-muted)}
#sg-round-directions .phone .small{font-size:13px;color:var(--sg-muted)}
#sg-round-directions .phone strong{font-weight:600}
#sg-round-directions .status{height:43px;flex:none;padding:14px 27px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:600}
#sg-round-directions .island{position:absolute;width:92px;height:23px;border-radius:20px;background:var(--sg-ink);top:9px;left:calc(50% - 46px)}
#sg-round-directions .status-icons{display:flex;gap:5px;align-items:center}
#sg-round-directions .contact{height:69px;flex:none;display:flex;align-items:center;padding:0 18px 10px 10px;gap:10px;border-bottom:1px solid var(--sg-line)}
#sg-round-directions .icon-button{height:40px;width:32px;flex:none;background:transparent;display:grid;place-items:center;border-radius:12px}
#sg-round-directions .avatar{width:40px;height:40px;border-radius:50%;flex:none;background-color:var(--sg-pink);background-image:var(--sg-zaza);background-size:192px 128px;background-position:-17px -3px;background-repeat:no-repeat;border:1px solid var(--sg-line)}
#sg-round-directions .contact-name{flex:1;min-width:0}
#sg-round-directions .contact-name strong{font-size:17px}
#sg-round-directions .time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;padding:7px 10px;background:var(--sg-soft);border-radius:30px;display:flex;align-items:center;gap:5px}
#sg-round-directions .phone .hourglass{width:17px;height:22px;object-fit:contain}
#sg-round-directions .phone-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#sg-round-directions .home-line{height:4px;width:118px;border-radius:20px;background:var(--sg-ink);margin:10px auto 9px;flex:none;opacity:.7}
#sg-round-directions .chat-content{padding:20px 19px;display:flex;flex-direction:column;gap:14px}
#sg-round-directions .chat-date{text-align:center;margin-bottom:5px!important;font-size:11px;color:var(--sg-muted)}
#sg-round-directions .bubble{border-radius:20px 20px 20px 5px;padding:13px 15px;background:var(--sg-soft);max-width:95%;align-self:flex-start}
#sg-round-directions .bubble.user{align-self:flex-end;background:var(--sg-button);color:var(--sg-button-ink);border-radius:20px 20px 5px 20px}
#sg-round-directions .bubble.recap{font-size:16px}
#sg-round-directions .message-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sg-muted);margin:0 0 -5px 4px}
#sg-round-directions .request{padding:18px;background:var(--sg-panel);border:1px solid var(--sg-line);border-radius:22px;display:flex;flex-direction:column;gap:13px}
#sg-round-directions .request-title{display:flex;gap:10px;align-items:center}
#sg-round-directions .request-symbol{width:41px;height:45px;display:grid;place-items:center;background:var(--sg-pink);color:var(--sg-accent);border-radius:12px}
#sg-round-directions .request-title strong{font-size:17px}
#sg-round-directions .request-meta&gt;span{display:inline-flex;align-items:center;gap:5px}
#sg-round-directions .request-meta{display:flex;gap:18px;font-size:12px;color:var(--sg-muted)}
#sg-round-directions .primary{background:var(--sg-button);color:var(--sg-button-ink)!important;min-height:47px;padding:12px 16px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500!important;width:100%}
#sg-round-directions .secondary{background:var(--sg-soft);min-height:44px;padding:11px 16px;border-radius:14px;width:100%;font-weight:500!important}
#sg-round-directions .bottom-chat{margin:auto 19px 0;border:1px solid var(--sg-line);border-radius:28px;padding:12px 15px;font-size:13px;color:var(--sg-muted);display:flex;align-items:center;gap:9px}
#sg-round-directions .bottom-chat i{flex:none}
#sg-round-directions .exam-tag{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--sg-muted)}
#sg-round-directions .sheet-scrim{position:absolute;inset:-112px 0 0;background:light-dark(#12251c29,#0005);z-index:1}
#sg-round-directions .study-sheet{position:absolute;inset:auto 0 -23px;z-index:2;background:var(--sg-panel);border-radius:29px 29px 0 0;padding:10px 22px 32px;box-shadow:0 -10px 32px light-dark(#10291c12,#0004);min-height:510px;display:flex;flex-direction:column}
#sg-round-directions .handle{width:34px;height:4px;background:var(--sg-line);border-radius:9px;margin:0 auto 14px}
#sg-round-directions .round-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
#sg-round-directions .round-top .icon-button{width:32px;height:32px;background:var(--sg-soft);border-radius:50%}
#sg-round-directions .round-title{display:flex;flex-direction:column;gap:2px}
#sg-round-directions .round-title strong{font-size:15px}
#sg-round-directions .track{height:4px;background:var(--sg-soft);border-radius:4px;overflow:hidden;flex:1}
#sg-round-directions .track span{display:block;height:100%;background:var(--sg-accent);border-radius:4px;transition:width .25s}
#sg-round-directions .progress-row{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;margin-bottom:21px}
#sg-round-directions .progress-row .small{font-size:11px;white-space:nowrap}
#sg-round-directions .topic{font-size:11px;color:var(--sg-accent);letter-spacing:1.1px;font-weight:600;text-transform:uppercase;margin-bottom:9px!important}
#sg-round-directions .question{margin-bottom:22px}
#sg-round-directions .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#sg-round-directions .answer{padding:12px 11px;min-height:69px;border:1px solid var(--sg-line)!important;border-radius:14px;background:var(--sg-panel);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;font-size:14px!important;text-align:left}
#sg-round-directions .letter{font-size:11px;color:var(--sg-muted)}
#sg-round-directions .answer.right{background:var(--sg-green-bg);border-color:var(--sg-green)!important;color:var(--sg-green)}
#sg-round-directions .answer.wrong{background:var(--sg-red-bg);border-color:var(--sg-red)!important;color:var(--sg-red)}
#sg-round-directions .answer.chosen{opacity:1}
#sg-round-directions .feedback{min-height:40px;padding:12px 0 9px;font-size:12px;display:flex;align-items:center;gap:7px;color:var(--sg-muted)}
#sg-round-directions .feedback.correct{color:var(--sg-green)}
#sg-round-directions .feedback.incorrect{color:var(--sg-red)}
#sg-round-directions .round-footer{margin-top:auto;padding-top:8px}
#sg-round-directions .round-footer&gt;.tiny{text-align:center;padding-top:9px}
#sg-round-directions .focus-top{height:61px;display:flex;align-items:center;padding:0 16px;gap:12px}
#sg-round-directions .focus-top .avatar{width:30px;height:30px;background-size:144px 96px;background-position:-13px -2px}
#sg-round-directions .focus-title{flex:1}
#sg-round-directions .focus-title strong{display:block;font-size:14px}
#sg-round-directions .focus-round{padding:3px 23px 8px;display:flex;flex-direction:column;flex:1;min-height:0}
#sg-round-directions .focus-round .question{padding:19px 0 17px;min-height:174px;display:flex;flex-direction:column;justify-content:center}
#sg-round-directions .focus-round h3{font-size:29px;line-height:1.2;letter-spacing:-.7px}
#sg-round-directions .focus-round .answer-grid{grid-template-columns:1fr;gap:10px}
#sg-round-directions .focus-round .answer{min-height:54px;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:10px 14px}
#sg-round-directions .focus-round .letter{width:25px;height:25px;border-radius:8px;background:var(--sg-soft);display:grid;place-items:center}
#sg-round-directions .focus-round .progress-row{margin-bottom:4px}
#sg-round-directions .quiet-note{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0 0;font-size:11px;color:var(--sg-muted)}
#sg-round-directions .packet-chat{padding-top:17px;gap:11px}
#sg-round-directions .packet-shell{position:relative;margin:6px 0 5px;isolation:isolate}
#sg-round-directions .packet-shell:before,#sg-round-directions .packet-shell:after{content:&quot;&quot;;position:absolute;inset:-5px 6px 5px;border-radius:22px;background:var(--sg-pink);border:1px solid var(--sg-line);z-index:-1;transform:rotate(-2deg)}
#sg-round-directions .packet-shell:after{inset:-9px 12px 9px;transform:rotate(2deg);z-index:-2}
#sg-round-directions .packet{border:1px solid var(--sg-line);border-radius:22px;padding:17px;background:var(--sg-panel)}
#sg-round-directions .packet .round-top{margin-bottom:11px}
#sg-round-directions .packet .round-title strong{font-size:13px}
#sg-round-directions .packet .progress-row{margin-bottom:17px}
#sg-round-directions .packet h3{font-size:22px;line-height:1.25}
#sg-round-directions .packet .question{margin-bottom:17px}
#sg-round-directions .packet .answer{min-height:61px;font-size:13px!important;padding:9px}
#sg-round-directions .packet .answer-grid{gap:7px}
#sg-round-directions .packet .feedback{min-height:38px;padding:9px 0;font-size:11px}
#sg-round-directions .packet .primary{min-height:42px;padding:9px;font-size:13px}
#sg-round-directions .packet .round-footer{padding-top:0}
#sg-round-directions .result-slip{background:var(--sg-panel);border:1px solid var(--sg-line);border-radius:20px;padding:19px}
#sg-round-directions .result-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:17px}
#sg-round-directions .result-top strong{font-size:14px}
#sg-round-directions .score{font-size:39px;line-height:1.1;letter-spacing:-1.6px;color:var(--sg-ink);font-weight:500;margin:7px 0 5px}
#sg-round-directions .score span{font-size:20px;letter-spacing:-.4px;color:var(--sg-muted)}
#sg-round-directions .score-dots{display:flex;gap:7px;margin-top:12px}
#sg-round-directions .score-dot{width:27px;height:27px;border-radius:9px;background:var(--sg-green-bg);color:var(--sg-green);display:grid;place-items:center;font-size:12px}
#sg-round-directions .score-dot.missed{background:var(--sg-soft);color:var(--sg-muted)}
#sg-round-directions .result-note{display:flex;align-items:center;gap:6px;color:var(--sg-muted);font-size:12px;border-top:1px solid var(--sg-line);padding-top:13px}
#sg-round-directions .result-actions{padding:3px 19px 5px;margin-top:auto;display:flex;flex-direction:column;gap:10px}
#sg-round-directions .practice-chip{font-size:11px;padding:6px 9px;border-radius:20px;background:var(--sg-pink);color:var(--sg-accent);white-space:nowrap}
#sg-round-directions .typing{background:var(--sg-soft);padding:16px;border-radius:18px;display:flex;gap:5px;width:fit-content}
#sg-round-directions .typing span{width:5px;height:5px;background:var(--sg-muted);border-radius:50%;animation:sg-dot 1.2s ease-in-out infinite}
#sg-round-directions .typing span:nth-child(2){animation-delay:.15s}#sg-round-directions .typing span:nth-child(3){animation-delay:.3s}
#sg-round-directions .unlock{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;gap:17px}
#sg-round-directions .unlock-symbol{width:66px;height:66px;background:var(--sg-green-bg);color:var(--sg-green);border-radius:24px;display:grid;place-items:center}
#sg-round-directions .unlock .primary{margin-top:25px}
#sg-round-directions .phone-main[data-scene]{animation:sg-enter .2s ease-out}
@keyframes sg-enter{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes sg-dot{0%,80%,100%{opacity:.35}40%{opacity:1}}
@media(max-width:380px){#sg-round-directions .stage{padding:20px 0 14px;min-height:840px}#sg-round-directions .phone{border-radius:28px;height:770px}#sg-round-directions .study-sheet{padding-left:17px;padding-right:17px;min-height:540px}#sg-round-directions .contact{gap:7px;padding-right:13px}#sg-round-directions .chat-content{padding-left:15px;padding-right:15px}#sg-round-directions .focus-round{padding-left:18px;padding-right:18px}#sg-round-directions .focus-round h3{font-size:27px}#sg-round-directions .packet{padding:15px}}
@media(prefers-reduced-motion:reduce){#sg-round-directions .phone-main[data-scene],#sg-round-directions .typing span{animation:none}#sg-round-directions .track span{transition:none}}

    const title=design===&#x27;focus&#x27;?(s.followup?&#x27;Three fresh questions&#x27;:&#x27;Four flashcards&#x27;):(s.followup?&#x27;A little extra practice&#x27;:&#x27;Biology · Quick round&#x27;);

;polite&quot;&gt;${answered?icon(correct?&#x27;check-circle-2&#x27;:&#x27;rotate-ccw&#x27;):&#x27;&#x27;}${feedback}&lt;/div&gt;&lt;div class=&quot;round-footer&quot;&gt;&lt;button class=&quot;primary cursor-interaction&quot; data-action=&quot;next&quot; ${answered?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;${s.index===list.length-1?&#x27;Back to Zaza&#x27;:&#x27;Next card&#x27;} ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;${design===&#x27;focus&#x27;?&#x27;&lt;div class=&quot;quiet-note&quot;&gt;&#x27;+icon(&#x27;message-circle&#x27;)+&#x27; Zaza will meet you after the round.&lt;/div&gt;&#x27;:design===&#x27;sheet&#x27;?&#x27;&lt;p class=&quot;tiny&quot;&gt;Your answers stay in this round.&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;

tart&quot;&gt;Try another round&lt;/button&gt;`}&lt;/div&gt;`;
